name: Android SDK unit tests
on: [push, pull_request]
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (codec, client assertions, models)
        working-directory: mobile-sample
        run: ./gradlew --no-daemon :nativesso-sdk:testDebugUnitTest
      - name: Assemble both apps
        working-directory: mobile-sample
        run: ./gradlew --no-daemon :super-app:assembleDebug :child-app:assembleDebug
