org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Base URL of the eSignet server the apps talk to. With `adb reverse tcp:8088 tcp:8088` and
# `adb reverse tcp:3000 tcp:3000` a USB-connected phone reaches the laptop as localhost.
esignetBaseUrl=http://localhost:8088
